spring:
  application:
    name: ems-algashop-ordering
  datasource:
    url: 'jdbc:h2:file:./microservices/ems-algashop-ordering/data/ordering;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE'
    username: sa
    password: '123'
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: 'true'
      settings.web-allow-others: 'true'
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
